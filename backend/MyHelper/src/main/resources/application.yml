management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: framework

spring:
  config:
    import: "optional:file:./.env[.properties]"
  # 接入消息持久化时移除此排除项并配置数据源。
  autoconfigure:
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  ai:
    model:
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      timeout: 60s
      max-retries: 0
      chat:
        model: ${AI_MODEL}
