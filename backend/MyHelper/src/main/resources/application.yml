# spring:
server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# servlet:
#   multipart:
#     enabled: true
#     max-file-size: 4MB      # 单个文件最大限制
#     max-request-size: 10MB   # 单次请求总大小限制
  config:
    import: "optional:file:./.env[.properties]"
  ai:
    model:
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      timeout: 60s
      max-retries: 0
      chat:
        model: ${AI_MODEL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
