management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: framework

spring:
  config:
    import: "optional:file:./.env[.properties]"
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      chat:
        completions-path: /chat/completions
        options:
          model: ${AI_MODEL}